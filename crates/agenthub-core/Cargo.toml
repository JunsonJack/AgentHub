[package]
name = "agenthub-core"
description = "AgentHub 与框架解耦的核心层：Connector、数据模型、快照、存储"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# 读：简单值模型；写：toml_edit 保留注释与排版（规划红线）
toml = "0.8"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
# 市场 HTTP（rustls，避免 OpenSSL 依赖）
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
# 密钥管理加密（AES 回退 / 非 Windows）
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
hostname = "0.4"

# Windows DPAPI：系统级用户绑定加密（密钥主路径）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"
